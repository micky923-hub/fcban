  <style>
    /* 이 화면 전용 배치. 색·글꼴·간격은 base.css 토큰만 쓴다. */
    .es-form { display: flex; flex-direction: column; gap: var(--sp-4); }
    .es-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .es-card { display: flex; flex-direction: column; gap: var(--sp-1); }
    .es-card--outline { background: var(--c-white); border: 1px solid var(--c-line); }
    .es-label { font-size: var(--fs-label); color: var(--c-muted); }
    .es-figure { font-size: var(--fs-figure); font-weight: 800; line-height: 1.2; color: var(--c-primary); letter-spacing: -0.02em; }
    .es-mid { font-size: 26px; font-weight: 700; line-height: 1.3; color: var(--c-ink); }
    .es-sub { font-size: var(--fs-label); color: var(--c-muted); }
    .es-estimate { margin-top: var(--sp-2); font-size: 15px; font-weight: 700; color: var(--c-ink); }
    .es-zero__title { font-size: 18px; font-weight: 700; color: var(--c-primary); }
    .es-zero__sub { font-size: 15px; color: var(--c-ink); }
    .bar { display: flex; height: 20px; border-radius: 4px; overflow: hidden; background: var(--c-line); }
    .bar__ded { background: var(--c-primary); }
    .bar__tax { background: var(--c-accent); }
    .bar__legend { display: flex; justify-content: space-between; margin-top: var(--sp-2); font-size: var(--fs-label); color: var(--c-muted); }
    .result-heading:focus { outline: none; }
  </style>
</head>
