<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>파이낸셜 다이어리</title>
  <meta name="description" content="건강 · 상속과 증여 · 내 나이의 날짜 — 입력값은 저장되지 않습니다">
  <meta property="og:type" content="website">
  <meta property="og:title" content="파이낸셜 다이어리">
  <meta property="og:description" content="건강 · 상속과 증여 · 내 나이의 날짜 — 입력값은 저장되지 않습니다">
  <meta name="theme-color" content="#0C2340">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/base.css">
  <link rel="modulepreload" href="./assets/ui.js">
  <style>
    /* 허브 전용 배치. 색·글꼴·간격은 base.css 토큰만 쓴다. */
    .hub-hero__title { max-width: 7.6em; font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; } /* PNG처럼 두 줄 */
    .hub-section { display: flex; flex-direction: column; gap: var(--sp-3); }
    .hub-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
    .hub-section__title { font-size: 17px; font-weight: 700; }
    .hub-section__meta { font-size: var(--fs-label); color: var(--c-muted); }

    .weekly { display: flex; flex-direction: column; gap: var(--sp-2); text-decoration: none; color: var(--c-ink); min-height: 56px; }
    .weekly__title {
      font-size: 17px; font-weight: 700; line-height: 1.45;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
    }
    .weekly__dongui { font-size: 14px; color: var(--c-muted); }
    .weekly__more { font-size: 14px; font-weight: 700; color: var(--c-accent); }

    .tools { display: flex; flex-direction: column; gap: var(--sp-3); }
    .tool {
      display: flex; align-items: center; gap: var(--sp-4);
      min-height: 64px; padding: var(--sp-3) var(--sp-4);
      border: 1px solid var(--c-line); border-radius: var(--radius);
      background: var(--c-white); color: var(--c-ink); text-decoration: none;
    }
    .tool:hover { border-color: var(--c-primary); }
    .tool__icon {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--c-tint); color: var(--c-primary);
    }

    /* 올해 알아둘 숫자 — 2열 카드. 결과 수치(--fs-figure)보다 작게: 한 화면 큰 수치 1개 규칙 */
    .numbers { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .number {
      height: 100%; display: flex; flex-direction: column; gap: var(--sp-1);
      padding: var(--sp-4); border-radius: var(--radius);
      background: var(--c-tint); color: var(--c-ink); text-decoration: none;
    }
    .number:hover { outline: 1px solid var(--c-primary); }
    .number__title { font-size: var(--fs-label); font-weight: 700; color: var(--c-muted); }
    .number__figure { font-size: 22px; font-weight: 800; line-height: 1.3; color: var(--c-primary); letter-spacing: -0.01em; }
    .number__sub { font-size: var(--fs-label); line-height: 1.5; color: var(--c-ink); }
    .hub-note { font-size: var(--fs-note); color: var(--c-muted); }

    /* 만든 사람 */
    .operator { display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); border: 1px solid var(--c-line); border-radius: var(--radius); }
    .operator__head { display: flex; align-items: center; gap: var(--sp-3); }
    .operator__avatar {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--c-primary); color: var(--c-white); font-size: 18px; font-weight: 700;
    }
    .operator__name { font-size: 15px; font-weight: 700; }
    .operator__text { font-size: 15px; color: var(--c-ink); }
    .operator__chat { align-self: flex-start; min-height: var(--touch); display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; color: var(--c-primary); text-decoration: none; }
    .tool__text { flex: 1; display: flex; flex-direction: column; }
    .tool__title { font-size: var(--fs-body); font-weight: 700; }
    .tool__sub { font-size: var(--fs-label); color: var(--c-muted); }
    .tool__arrow { flex: none; font-size: 20px; color: var(--c-primary); }
  </style>
</head>
<body>
  <div class="page" id="app">
    <!-- 스크립트가 열리기 전 자리(스켈레톤) — CLS 방지 -->
    <header class="site-header"><span class="site-header__link">파이낸셜 다이어리</span></header>
    <main class="content"><div class="skeleton" style="height: 420px"></div></main>
  </div>
  <!-- 이번 주 다이어리: scripts/inline-weekly.mjs 가 content/weekly.json 을 빌드 때 넣는다. 비어 있으면 영역 숨김 -->
  <script type="application/json" id="weekly-data"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
