<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 나이 건강 체크 · 파이낸셜 다이어리</title>
  <meta name="description" content="내 나이대 검진 항목 확인하기">
  <meta property="og:type" content="website">
  <meta property="og:title" content="내 나이 건강 체크">
  <meta property="og:description" content="내 나이대 검진 항목 확인하기">
  <meta name="theme-color" content="#0C2340">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="modulepreload" href="../assets/ui.js">
  <link rel="modulepreload" href="../assets/healthData.data.js">
  <style>
    /* 이 화면 전용 배치. 색·글꼴·간격은 base.css 토큰만 쓴다. */
    .hc-form { display: flex; flex-direction: column; gap: var(--sp-5); }
    .hc-title-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .hc-section { display: flex; flex-direction: column; gap: var(--sp-2); }
    .hc-section__title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: var(--sp-1); }
    .hc-checks { display: flex; flex-direction: column; gap: var(--sp-2); }
    .hc-checks li { display: flex; gap: var(--sp-2); align-items: baseline; padding: var(--sp-3) var(--sp-4); background: var(--c-tint); border-radius: var(--radius); }
    .hc-checks li::before { content: '✓'; color: var(--c-primary); font-weight: 700; }
    .hc-cancer { display: flex; flex-direction: column; gap: var(--sp-2); }
    .hc-cancer li { display: flex; align-items: center; gap: var(--sp-3); min-height: 52px; padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4); border: 1px solid var(--c-line); border-radius: var(--radius); }
    .hc-cancer__name { flex: none; width: 5.5em; font-weight: 700; }
    .hc-cancer__detail { flex: 1; font-size: 14px; color: var(--c-ink); }
    .hc-empty { font-size: 15px; color: var(--c-muted); }
    .hc-common { font-size: 15px; }
    .hc-common .bullets li { font-size: 15px; }
    .hc-source__text { margin-top: var(--sp-1); font-size: 14px; color: var(--c-ink); }
    .result-heading:focus { outline: none; }
  </style>
</head>
<body>
  <div class="page" id="app">
    <header class="site-header"><span class="site-header__link"><span aria-hidden="true">←</span> 내 나이 건강 체크</span></header>
    <main class="content"><div class="skeleton" style="height: 420px"></div></main>
  </div>
  <noscript><p class="content">이 도구는 브라우저의 JavaScript 를 사용합니다.</p></noscript>
  <script type="module" src="./health.js"></script>
</body>
</html>
