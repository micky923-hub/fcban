<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 나이 달력 · 파이낸셜 다이어리</title>
  <meta name="description" content="생년월일 하나로 검진·연금·보험나이 날짜를 한눈에 — 내 나이 달력">
  <meta property="og:type" content="website">
  <meta property="og:title" content="내 나이 달력">
  <meta property="og:description" content="생년월일 하나로 검진·연금·보험나이 날짜를 한눈에 — 내 나이 달력">
  <meta name="theme-color" content="#0C2340">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="modulepreload" href="../assets/ui.js">
  <link rel="modulepreload" href="../assets/ageCalendar.js">
  <style>
    /* 이 화면 전용 배치. 색·글꼴·간격은 base.css 토큰만 쓴다. */
    .cal-form { display: flex; flex-direction: column; gap: var(--sp-4); }
    .cal-base__today { display: flex; gap: var(--sp-2); align-items: baseline; }
    .cal-base__today span:first-child { color: var(--c-muted); }

    .cal-summary { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); font-size: 14px; color: var(--c-muted); }
    .cal-summary .text-link { font-size: 15px; }

    .age-card { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-5); }
    .age-card__label { font-size: var(--fs-label); color: var(--c-muted); }
    .age-card__figure { font-size: var(--fs-figure); font-weight: 800; line-height: 1.15; color: var(--c-primary); letter-spacing: -0.02em; }
    .age-card__unit { font-size: 28px; font-weight: 700; margin-left: 4px; }
    .age-card__next { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-2); font-size: var(--fs-label); color: var(--c-muted); text-align: right; }
    .age-card__next strong { color: var(--c-ink); font-weight: 600; }

    .timeline { position: relative; display: flex; flex-direction: column; gap: var(--sp-5); padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: var(--c-line); }
    .timeline__item { position: relative; }
    .timeline__item::before { content: ''; position: absolute; left: -28px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--c-primary); box-shadow: 0 0 0 3px var(--c-white); }
    .timeline__item--hl::before { background: var(--c-accent); }
    .timeline__date { font-size: var(--fs-label); font-weight: 700; color: var(--c-ink); }
    .timeline__item--hl .timeline__date { color: var(--c-accent); }
    .timeline__title { display: flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-body); font-weight: 700; line-height: 1.45; }
    .timeline__sub { margin-top: 2px; font-size: var(--fs-label); color: var(--c-muted); }
    .timeline__sub a { color: var(--c-primary); font-weight: 600; text-decoration: none; display: inline-block; padding: 10px 0; margin: -10px 0; }
    .info-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--touch); height: var(--touch); margin: -10px -8px -10px -4px; border: 0; background: none; color: var(--c-accent); cursor: pointer; }
    .info-btn svg { width: 18px; height: 18px; }

    .result-heading:focus { outline: none; }
  </style>
</head>
<body>
  <div class="page" id="app">
    <!-- 스크립트가 열리기 전 자리(스켈레톤) — CLS 방지 -->
    <header class="site-header"><span class="site-header__link"><span aria-hidden="true">←</span> 내 나이 달력</span></header>
    <main class="content"><div class="skeleton" style="height: 320px"></div></main>
  </div>
  <noscript><p class="content">이 도구는 브라우저의 JavaScript 를 사용합니다.</p></noscript>
  <script type="module" src="./calendar.js"></script>
</body>
</html>
